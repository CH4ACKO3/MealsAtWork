name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_release_run:
        description: Existing release run ID to verify remote files and finish description synchronization (no file upload)
        type: string
        default: ''
      verify_steam:
        description: Verify Steam login and Workshop ownership without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'maw-release' || format('maw-ci-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Build, validate and package
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./Tools/CI/Build.ps1 -Tag $env:RELEASE_TAG
      - name: Validate Workshop payload without publishing
        shell: pwsh
        run: |
          ./Tools/CI/PublishWorkshop.ps1 -ArtifactRoot artifacts/ci -DryRun
          ./Tools/CI/Test-Package.ps1 -ArtifactRoot artifacts/ci
          ./Tools/CI/Test-SteamSession.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workshop-package
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workshop-package
          path: artifacts/delivered
      - name: Verify downloaded artifact
        shell: pwsh
        run: |
          ./Tools/CI/PublishWorkshop.ps1 -ArtifactRoot artifacts/delivered -DryRun
          dotnet artifacts/delivered/publisher/WorkshopPublisher.dll validate artifacts/delivered
          if ($LASTEXITCODE) { throw 'Downloaded bilingual publisher validation failed.' }
      - name: Publish readiness
        shell: pwsh
        env:
          STEAM_READY: ${{ vars.STEAM_PUBLISH_ENABLED }}
        run: |
          if ($env:STEAM_READY -ne 'true') {
            'Steam publishing is disabled. Build artifacts are ready; configure steam-workshop secrets and set STEAM_PUBLISH_ENABLED=true before a release tag.' >> $env:GITHUB_STEP_SUMMARY
          }
  github-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workshop-package
          path: package
      - name: Attach the tested package to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference='Stop'
          $m=Get-Content package/manifest.json -Raw | ConvertFrom-Json
          $zip=Join-Path package $m.archive
          if ((Get-FileHash $zip).Hash -cne $m.archiveSha256) { throw 'Release artifact checksum mismatch.' }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $zip package/manifest.json package/Description.en.bbcode package/Description.zh-CN.bbcode package/release-notes.en.md package/release-notes.zh-CN.md --clobber
          } else {
            $arguments=@('release','create',$env:RELEASE_TAG,$zip,'package/manifest.json','package/Description.en.bbcode','package/Description.zh-CN.bbcode','package/release-notes.en.md','package/release-notes.zh-CN.md','--verify-tag','--title',$env:RELEASE_TAG,'--notes-file','package/release-notes.md')
            if ($m.version.Contains('-')) { $arguments+='--prerelease' }
            gh @arguments
          }
          if ($LASTEXITCODE) { throw 'GitHub Release upload failed.' }
  steam-workshop:
    needs: [build, github-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.STEAM_PUBLISH_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    environment: steam-workshop
    concurrency:
      group: maw-steam-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workshop-package
          path: package
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Update the existing Workshop item
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STEAM_SESSION_OUTPUT: ${{ runner.temp }}/maw-session.json
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_CONFIG_VDF_BASE64: ${{ secrets.STEAM_CONFIG_VDF_BASE64 }}
        run: ./Tools/CI/PublishWorkshop.ps1 -ArtifactRoot package
      - name: Save encrypted Steam session
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steam-session-state
          path: ${{ runner.temp }}/maw-session.json
          if-no-files-found: ignore
          retention-days: 90
  verify-steam:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.verify_steam
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    environment: steam-workshop
    concurrency:
      group: maw-steam-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workshop-package
          path: package
      - name: Verify credentials without publishing
        if: inputs.verify_steam
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STEAM_SESSION_OUTPUT: ${{ runner.temp }}/maw-session.json
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_CONFIG_VDF_BASE64: ${{ secrets.STEAM_CONFIG_VDF_BASE64 }}
        run: |
          ./Tools/CI/PublishWorkshop.ps1 -ArtifactRoot package -CheckOnly
      - name: Save encrypted Steam session
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steam-session-state
          path: ${{ runner.temp }}/maw-session.json
          if-no-files-found: ignore
          retention-days: 90
  verify-published:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.verify_release_run != ''
    runs-on: windows-latest
    timeout-minutes: 10
    environment: steam-workshop
    concurrency:
      group: maw-steam-account
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workshop-package
          path: package
          run-id: ${{ inputs.verify_release_run }}
          github-token: ${{ github.token }}
      - name: Verify published files and synchronize descriptions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STEAM_SESSION_OUTPUT: ${{ runner.temp }}/maw-session.json
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_CONFIG_VDF_BASE64: ${{ secrets.STEAM_CONFIG_VDF_BASE64 }}
        run: ./Tools/CI/PublishWorkshop.ps1 -ArtifactRoot package -VerifyPublished
      - name: Save encrypted Steam session
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steam-session-state
          path: ${{ runner.temp }}/maw-session.json
          if-no-files-found: ignore
          retention-days: 90
